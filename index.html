<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nDAO BEATS · Parametric Curve Synthesizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0c0f;--bgR:#10131a;--bgP:#141820;--bgI:#1a1e28;--bdr:#1e2230;--bdrL:#252a38;--bdrH:#353b4e;
    --tx:#8a90a0;--txB:#e0e4f0;--txD:#555a6e;--txM:#3e4358;--txG:#2e3248;
    --red:#ff5555;--grn:#44dd66;--blu:#3399ff;--yel:#ffcc22;--pur:#aa77ff;--cyn:#44ddee;--orn:#ff8833;--pnk:#ff5599;
    --beats:#ff8833;--xpr:#7b68ee;
  }
  body{background:var(--bg);color:var(--tx);font-family:'JetBrains Mono','Fira Code',monospace;overflow:hidden;height:100vh;width:100vw;user-select:none}
  #app{display:flex;flex-direction:column;height:100vh}

  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:50px;border-bottom:1px solid var(--bdr);background:var(--bgR);flex-shrink:0;z-index:100}
  .header-left,.header-right{display:flex;align-items:center;gap:6px}
  .tab-btn{background:none;border:none;color:var(--txD);font-size:10px;font-family:inherit;letter-spacing:.12em;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;white-space:nowrap;transition:all .15s}
  .tab-btn:hover{color:var(--tx);background:rgba(255,255,255,.03)}.tab-btn.active{color:var(--txB);background:rgba(255,255,255,.06)}
  .nav-group{display:flex;background:var(--bgI);border-radius:6px;overflow:hidden;border:1px solid var(--bdrL)}
  .nav-btn{background:none;border:none;color:var(--txD);font-size:12px;padding:6px 10px;cursor:pointer;font-family:inherit;transition:all .15s}
  .nav-btn:hover{color:var(--txB);background:rgba(255,255,255,.05)}.nav-btn.glow{color:var(--grn)}
  .hdr-btn{background:none;border:1px solid transparent;color:var(--txD);font-size:10px;font-family:inherit;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:6px;transition:all .15s;white-space:nowrap}
  .hdr-btn:hover{color:var(--txB);background:rgba(255,255,255,.03)}
  .hdr-btn.outlined{border-color:var(--bdrH)}.hdr-btn.xpr{border-color:var(--xpr);color:var(--xpr)}
  .hdr-btn.xpr:hover{background:rgba(123,104,238,.1)}
  .hdr-btn.beats{border-color:var(--beats);color:var(--beats)}.hdr-btn.beats:hover{background:rgba(255,136,51,.1)}
  .badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:2px}
  .badge-y{background:var(--yel);color:#000}.badge-b{background:var(--beats);color:#000}

  /* Main */
  .main{flex:1;position:relative;overflow:hidden;display:flex}
  .canvas-area{flex:1;position:relative}
  #curveCanvas{width:100%;height:100%;cursor:grab;display:block}#curveCanvas.grabbing{cursor:grabbing}

  /* Overlays */
  .equations{position:absolute;top:16px;left:72px;z-index:10;font-size:11.5px;line-height:1.9;color:var(--txD);pointer-events:none}
  .equations .vx{color:var(--red);font-weight:600}.equations .vy{color:var(--grn);font-weight:600}
  .equations .vz{color:var(--blu);font-weight:600}.equations .vw{color:var(--yel);font-weight:600}
  .equations .dim{color:#333}.equations .hint{margin-top:8px;font-size:8px;letter-spacing:.18em;color:var(--txM)}

  .param-cards{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:10}
  .pcard{width:52px;padding:7px 5px;background:rgba(16,19,26,.93);border-radius:7px;text-align:center;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s}
  .pcard:hover{transform:scale(1.08)}.pcard.sel{box-shadow:0 0 12px rgba(255,255,255,.06)}
  .pcard .lb{font-size:15px;font-weight:700;margin-bottom:2px}.pcard .rn{font-size:6.5px;color:#444;line-height:1.3}
  .pcard .mp{margin-top:2px;font-size:5.5px;color:#383850;letter-spacing:.1em;text-transform:uppercase}

  .preset-ind{position:absolute;top:16px;right:16px;z-index:10;font-size:9px;letter-spacing:.15em;color:var(--txG);text-transform:uppercase;pointer-events:none}
  .footer-ln{position:absolute;bottom:10px;right:16px;font-size:9px;color:var(--txG);letter-spacing:.04em;pointer-events:none}
  .speed-bg{position:absolute;bottom:10px;left:16px;font-size:8px;letter-spacing:.1em;color:var(--txG);z-index:10;pointer-events:none}
  .kbd-hint{position:absolute;bottom:30px;left:16px;font-size:7px;letter-spacing:.14em;color:var(--txG);z-index:10;pointer-events:none;line-height:2}

  /* Audio visualizer bar */
  .audio-viz{position:absolute;bottom:0;left:0;right:0;height:40px;z-index:5;pointer-events:none;opacity:.6}

  /* Side Panel */
  .side-panel{width:0;overflow:hidden;background:var(--bgP);border-left:1px solid var(--bdr);flex-shrink:0;transition:width .3s;z-index:50;display:flex;flex-direction:column}
  .side-panel.open{width:360px}
  .pnl-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bdr);font-size:10px;letter-spacing:.12em;font-weight:600;color:var(--txB)}
  .pnl-close{background:none;border:none;color:var(--txD);font-size:16px;cursor:pointer;padding:3px;line-height:1}.pnl-close:hover{color:var(--txB)}
  .pnl-body{flex:1;overflow-y:auto;padding:14px}.pnl-body::-webkit-scrollbar{width:3px}.pnl-body::-webkit-scrollbar-thumb{background:var(--bdrL);border-radius:2px}

  .sec{margin-bottom:18px}.sec-t{font-size:8px;letter-spacing:.18em;color:var(--txM);margin-bottom:8px;text-transform:uppercase}
  .fld{margin-bottom:10px}.fld-l{font-size:9px;color:var(--txD);margin-bottom:4px;display:flex;align-items:center;gap:5px}
  .fld-l .dot{width:5px;height:5px;border-radius:50%}
  .finp{width:100%;background:var(--bgI);border:1px solid var(--bdrL);color:var(--txB);font-family:inherit;font-size:11px;padding:7px 9px;border-radius:5px;outline:none;transition:border .15s}
  .finp:focus{border-color:var(--txD)}.finp::placeholder{color:var(--txG)}
  select.finp{cursor:pointer}

  .srow{display:flex;align-items:center;gap:8px;margin-bottom:7px}.slbl{font-size:9px;color:var(--txD);width:65px;flex-shrink:0}.sval{font-size:9px;color:var(--txB);width:40px;text-align:right;flex-shrink:0}
  input[type="range"]{flex:1;-webkit-appearance:none;height:3px;background:var(--bdrL);border-radius:2px;outline:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--tx);cursor:pointer;border:2px solid var(--bg)}

  .brow{display:flex;gap:6px;flex-wrap:wrap}
  .bsm{background:var(--bgI);border:1px solid var(--bdrL);color:var(--tx);font-family:inherit;font-size:9px;letter-spacing:.04em;padding:5px 10px;border-radius:4px;cursor:pointer;transition:all .15s}
  .bsm:hover{border-color:var(--txD);color:var(--txB)}.bsm.danger{border-color:var(--red);color:var(--red)}
  .bsm.active{border-color:var(--blu);color:var(--blu);background:rgba(51,153,255,.08)}
  .bsm.beats-btn{border-color:var(--beats);color:var(--beats)}.bsm.beats-btn:hover{background:rgba(255,136,51,.08)}
  .bsm.xpr-btn{border-color:var(--xpr);color:var(--xpr)}.bsm.xpr-btn:hover{background:rgba(123,104,238,.08)}

  .preset-list{display:flex;flex-direction:column;gap:3px}
  .preset-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--bdr);transition:all .15s;font-size:10px}
  .preset-item:hover{border-color:var(--bdrH);background:rgba(255,255,255,.02)}.preset-item.current{border-color:var(--blu);background:rgba(51,153,255,.06);color:var(--txB)}
  .preset-item .fav-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--txG);padding:1px}.fav-btn:hover{color:var(--yel)}.fav-btn.is-fav{color:var(--yel)}

  /* Modals */
  .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}
  .modal{background:var(--bgP);border:1px solid var(--bdr);border-radius:10px;padding:22px;width:420px;max-width:92vw;max-height:85vh;overflow-y:auto}
  .modal-t{font-size:12px;font-weight:600;color:var(--txB);margin-bottom:14px;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
  .modal-txt{font-size:10px;color:var(--txD);line-height:1.7;margin-bottom:14px}
  .modal-acts{display:flex;gap:7px;justify-content:flex-end}
  .mbtn{background:var(--bgI);border:1px solid var(--bdrL);color:var(--tx);font-family:inherit;font-size:10px;padding:7px 16px;border-radius:5px;cursor:pointer;transition:all .15s}
  .mbtn:hover{border-color:var(--txD);color:var(--txB)}.mbtn.primary{background:var(--xpr);border-color:var(--xpr);color:#fff}
  .mbtn.beats-primary{background:var(--beats);border-color:var(--beats);color:#000;font-weight:600}

  /* Wallet status bar */
  .wallet-bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(123,104,238,.08);border:1px solid rgba(123,104,238,.2);border-radius:5px;font-size:9px;color:var(--xpr)}
  .wallet-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* Toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bgP);border:1px solid var(--bdrL);color:var(--txB);font-family:inherit;font-size:10px;padding:9px 18px;border-radius:7px;z-index:2000;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Context menu */
  .ctx-menu{position:fixed;background:var(--bgP);border:1px solid var(--bdrL);border-radius:7px;padding:3px;z-index:500;min-width:190px;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none}
  .ctx-menu.show{display:block}
  .ctx-item{display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:10px;color:var(--tx);cursor:pointer;border-radius:4px;border:none;background:none;width:100%;font-family:inherit;text-align:left;transition:all .1s}
  .ctx-item:hover{background:rgba(255,255,255,.05);color:var(--txB)}.ctx-sep{height:1px;background:var(--bdr);margin:3px 7px}

  /* Audio section styling */
  .osc-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bdr);border-radius:5px;margin-bottom:6px;background:rgba(255,255,255,.01)}
  .osc-row .osc-id{font-size:11px;font-weight:700;width:20px;flex-shrink:0}
  .osc-row select,.osc-row input{font-family:inherit;font-size:9px}
  .osc-row select{background:var(--bgI);border:1px solid var(--bdrL);color:var(--txB);padding:3px 5px;border-radius:3px;outline:none;cursor:pointer}
  .osc-row input[type="number"]{background:var(--bgI);border:1px solid var(--bdrL);color:var(--txB);padding:3px 5px;border-radius:3px;outline:none;width:55px;text-align:center}

  /* Waveform display */
  .waveform-mini{width:100%;height:50px;border:1px solid var(--bdr);border-radius:5px;background:var(--bg);margin-bottom:10px}

  /* Chain tx log */
  .tx-log{max-height:120px;overflow-y:auto;font-size:8px;color:var(--txD);border:1px solid var(--bdr);border-radius:4px;padding:6px;background:var(--bg);line-height:1.8}
  .tx-log a{color:var(--xpr);text-decoration:none}.tx-log a:hover{text-decoration:underline}

  /* Responsive */
  @media(max-width:768px){
    .tab-btn{font-size:8px;padding:5px 8px;gap:3px}.hdr-btn{font-size:8px;padding:4px 7px}
    .side-panel.open{width:290px}.equations{font-size:10px;left:64px}.kbd-hint{display:none}
    .modal{width:95vw;padding:16px}
  }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <button class="tab-btn active" id="tabParam" onclick="setTab('parametric')">▣ PARAMETRIC</button>

</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctxMenu"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ProtonWebSDK — live XPR Network (cdnjs primary, unpkg + jsdelivr fallbacks) -->
<script>
// Robust multi-CDN loader for @proton/web-sdk
(function loadProtonSDK() {
  const sources = [
    "https://cdnjs.cloudflare.com/ajax/libs/proton-web-sdk/4.2.20/bundle.min.js",
    "https://unpkg.com/@proton/web-sdk@4.2.20",
    "https://cdn.jsdelivr.net/npm/@proton/web-sdk@4.2.20",
    "https://cdnjs.cloudflare.com/ajax/libs/proton-web-sdk/4.2.20/bundle.js"
  ];
  let idx = 0;
  function tryLoad() {
    if (window.ProtonWebSDK) { console.log("[XPR] ProtonWebSDK already available"); return; }
    if (idx >= sources.length) {
      console.error("[XPR] All CDN sources failed to load ProtonWebSDK");
      document.getElementById("walletBtn").innerHTML = "⚠ SDK FAILED";
      document.getElementById("walletBtn").title = "ProtonWebSDK could not be loaded from any CDN";
      return;
    }
    const src = sources[idx++];
    console.log("[XPR] Loading SDK from:", src);
    const script = document.createElement("script");
    script.src = src;
    script.crossOrigin = "anonymous";
    script.onload = function() {
      if (window.ProtonWebSDK) {
        console.log("[XPR] ProtonWebSDK loaded successfully from:", src);
      } else {
        console.warn("[XPR] Script loaded but ProtonWebSDK not found, trying next source...");
        tryLoad();
      }
    };
    script.onerror = function() {
      console.warn("[XPR] Failed to load from:", src);
      tryLoad();
    };
    document.head.appendChild(script);
  }
  tryLoad();
})();
</script>
<script>
// ═══════════════════════════════════════════════════════════════
//  XPR NETWORK — LIVE WEBAUTH INTEGRATION
// ═══════════════════════════════════════════════════════════════
let protonLink = null;
let session = null;
let walletConnected = false;
let walletAccount = "";
let walletPermission = "active";
let beatsBalance = "0.00000000";

// XPR Network mainnet endpoints (ordered by reliability)
const XPR_ENDPOINTS = [
  "https://proton.eosusa.io",
  "https://proton.cryptolions.io",
  "https://api.protonnz.com",
  "https://proton.pink.gg",
  "https://proton.greymass.com"
];
const CHAIN_ID = "384da888112027f0321850a169f737c33e53b388aad48b5adace4bab97f437e0";
const APP_NAME = "nDAO BEATS Synthesizer";
const TOKEN_CONTRACT = "tokencreate";
const TOKEN_SYMBOL = "8,BEATS";
const NDAO_ACCOUNT = "nftitledao";

// ── Restore session on page load ──
async function restoreSession() {
  if (!window.ProtonWebSDK) return;
  try {
    const { link, session: sess } = await ProtonWebSDK({
      linkOptions: {
        endpoints: XPR_ENDPOINTS,
        chainId: CHAIN_ID,
        restoreSession: true,
      },
      transportOptions: {
        requestAccount: NDAO_ACCOUNT,
      },
      selectorOptions: {
        appName: APP_NAME,
        appLogo: "https://nftitle.net/images/ndao-logo.png",
        customStyleOptions: {
          modalBackgroundColor: "#0a0c0f",
          logoBackgroundColor: "#10131a",
          isLogoRound: true,
          optionBackgroundColor: "#141820",
          optionFontColor: "#e0e4f0",
          primaryFontColor: "#8a90a0",
          secondaryFontColor: "#555a6e",
          linkColor: "#7b68ee",
        },
      },
    });
    if (sess) {
      protonLink = link;
      session = sess;
      walletConnected = true;
      walletAccount = sess.auth.actor.toString();
      walletPermission = sess.auth.permission.toString();
      await fetchBeatsBalance();
      updateWalletUI();
      console.log("[XPR] Session restored:", walletAccount);
    }
  } catch (e) {
    console.log("[XPR] No previous session to restore");
  }
}

// ── Connect wallet (live WebAuth) ──
async function connectWallet() {
  if (walletConnected) { togglePanel("chain"); return; }

  // Wait for SDK if still loading (up to 5 seconds)
  if (!window.ProtonWebSDK) {
    showToast("Loading WebAuth SDK...");
    let waited = 0;
    while (!window.ProtonWebSDK && waited < 5000) {
      await new Promise(r => setTimeout(r, 250));
      waited += 250;
    }
  }

  if (!window.ProtonWebSDK) {
    showToast("⚠ WebAuth SDK not loaded — check your connection and refresh");
    console.error("[XPR] ProtonWebSDK is not available on window");
    return;
  }

  try {
    showToast("Opening WebAuth...");

    const { link, session: sess } = await ProtonWebSDK({
      linkOptions: {
        endpoints: XPR_ENDPOINTS,
        chainId: CHAIN_ID,
        restoreSession: false,
      },
      transportOptions: {
        requestAccount: NDAO_ACCOUNT,
      },
      selectorOptions: {
        appName: APP_NAME,
        appLogo: "https://nftitle.net/images/ndao-logo.png",
        customStyleOptions: {
          modalBackgroundColor: "#0a0c0f",
          logoBackgroundColor: "#10131a",
          isLogoRound: true,
          optionBackgroundColor: "#141820",
          optionFontColor: "#e0e4f0",
          primaryFontColor: "#8a90a0",
          secondaryFontColor: "#555a6e",
          linkColor: "#7b68ee",
        },
      },
    });

    protonLink = link;
    session = sess;
    walletConnected = true;
    walletAccount = sess.auth.actor.toString();
    walletPermission = sess.auth.permission.toString();

    showToast(`⚡ Connected: ${walletAccount}`);
    console.log("[XPR] Connected:", walletAccount, "@", walletPermission);

    await fetchBeatsBalance();
    updateWalletUI();
    togglePanel("chain");

  } catch (err) {
    console.error("[XPR] Wallet connect error:", err);
    if (err.message && err.message.includes("cancelled")) {
      showToast("Connection cancelled by user");
    } else {
      showToast("Connection failed: " + (err.message || "Check WebAuth wallet"));
    }
  }
}

// ── Fetch $BEATS balance with endpoint fallback ──
async function fetchBeatsBalance() {
  if (!walletAccount) return;

  for (const ep of XPR_ENDPOINTS) {
    try {
      const res = await fetch(`${ep}/v1/chain/get_currency_balance`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: TOKEN_CONTRACT,
          account: walletAccount,
          symbol: "BEATS"
        })
      });
      if (!res.ok) continue;
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        beatsBalance = data[0].split(" ")[0];
      } else {
        beatsBalance = "0.00000000";
      }
      updateWalletUI();
      return;
    } catch (e) {
      console.warn(`[XPR] Balance fetch failed on ${ep}:`, e.message);
      continue;
    }
  }
  console.error("[XPR] All endpoints failed for balance fetch");
}

// ── Get account table rows (for additional token info) ──
async function getTableRows(code, scope, table, limit = 10) {
  for (const ep of XPR_ENDPOINTS) {
    try {
      const res = await fetch(`${ep}/v1/chain/get_table_rows`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ json: true, code, scope, table, limit })
      });
      if (!res.ok) continue;

const txLog = [];

async function pushTransaction(actions) {
  if (!walletConnected || !session) {
    showToast("Connect wallet first");
    return null;
  }

  try {
    const result = await session.transact(
      { actions },
      { broadcast: true }
    );

    // Extract transaction ID from result
    const txId = result.processed?.id
      || result.transaction_id
      || (result.resolved && result.resolved.transaction && result.resolved.transaction.id)
      || null;

    if (!txId) {
      console.warn("[XPR] TX submitted but no ID returned:", result);
      showToast("TX submitted — confirming...");
      txLog.unshift({
        id: "pending_" + Date.now(),
        time: new Date().toISOString(),
        actions: actions.map(a => `${a.account}::${a.name}`),
        status: "pending"
      });
      return "pending";
    }

    txLog.unshift({
      id: txId,
      time: new Date().toISOString(),
      actions: actions.map(a => `${a.account}::${a.name}`),
      status: "confirmed"
    });

    showToast(`✓ TX confirmed: ${txId.slice(0, 12)}...`);
    console.log("[XPR] TX confirmed:", txId);
    return txId;

  } catch (err) {
    console.error("[XPR] Transaction error:", err);

    let errorMsg = "Transaction failed";
    if (err.message) {
      if (err.message.includes("cancelled") || err.message.includes("declined")) {
        errorMsg = "Transaction cancelled by user";
      } else if (err.message.includes("balance")) {
        errorMsg = "Insufficient BEATS balance";
      } else if (err.message.includes("CPU") || err.message.includes("NET")) {
        errorMsg = "Insufficient CPU/NET resources — stake more XPR";
      } else {
        errorMsg = err.message.slice(0, 100);
      }
    }

    txLog.unshift({
      id: "failed_" + Date.now(),
      time: new Date().toISOString(),
      actions: actions.map(a => `${a.account}::${a.name}`),
      status: "failed",
      error: errorMsg
    });

    showToast(errorMsg);
    return null;
  }
}

async function mintComposition() {
  if (!walletConnected) { connectWallet(); return; }

  const p = customExpr || getPreset();
  const memoData = buildMintMemo(p);

  const actions = [{
    account: TOKEN_CONTRACT,
    name: "transfer",
    authorization: [{ actor: walletAccount, permission: walletPermission }],
    data: {
      from: walletAccount,
      to: NDAO_ACCOUNT,
      quantity: "1.00000000 BEATS",
      memo: memoData
    }
  }];

  const txId = await pushTransaction(actions);
  if (txId) {
    showToast(`🎵 Composition minted! TX: ${txId.slice(0, 12)}...`);
    await fetchBeatsBalance();
  }
  if (openPanelId === "chain") renderPanel();
}

// Build detailed memo with synth stats (max 256 chars for XPR Network)
function buildMintMemo(p) {
  // Compact format: key data in every byte
  const oscStr = oscConfigs.map((o,i) =>
    `${o.wave.slice(0,3)}:${o.freq}Hz:d${o.detune}:g${o.gain.toFixed(1)}`
  ).join("|");

  const memo = [
    `nDAO_BEATS_v1`,
    `curve:${(p.name||"custom").slice(0,12)}`,
    `mode:${mode}`,
    `osc:[${oscStr}]`,
    `flt:${audioParams.filterType.slice(0,3)}@${audioParams.filterFreq}Hz/Q${audioParams.filterQ.toFixed(1)}`,
    `lfo:${audioParams.lfoRate.toFixed(1)}Hz*${audioParams.lfoDepth}`,
    `vol:${Math.round(audioParams.masterVol*100)}%`,
    `t:${Date.now()}`
  ].join(";");

  // XPR Network memo max 256 chars
  return memo.slice(0, 256);
}

function getMemoPreview() {
  const p = customExpr || getPreset();

let audioCtx = null;
let masterGain = null;
let analyser = null;
let oscillators = [];
let audioPlaying = false;
let lfo = null;
let filterNode = null;

const AUDIO_DEFAULTS = {
  masterVol: 0.3,
  oscCount: 3,
  baseFreq: 220,
  filterFreq: 2000,
  filterQ: 1,
  filterType: "lowpass",
  lfoRate: 0.5,
  lfoDepth: 20,
  reverbMix: 0.2,
  attack: 0.05,
  decay: 0.3,
  sustain: 0.7,
  release: 0.5,
};

let audioParams = { ...AUDIO_DEFAULTS };

const WAVEFORMS = ["sine", "triangle", "sawtooth", "square"];
const FILTER_TYPES = ["lowpass", "highpass", "bandpass", "notch"];

// Oscillator configs
let oscConfigs = [
  { wave: "sine", freq: 220, detune: 0, gain: 0.8 },
  { wave: "triangle", freq: 330, detune: 5, gain: 0.4 },
  { wave: "sawtooth", freq: 440, detune: -3, gain: 0.2 },
];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = audioParams.masterVol;

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;

  filterNode = audioCtx.createBiquadFilter();
  filterNode.type = audioParams.filterType;
  filterNode.frequency.value = audioParams.filterFreq;
  filterNode.Q.value = audioParams.filterQ;

  // LFO for filter modulation
  lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = audioParams.lfoRate;
  lfoGain.gain.value = audioParams.lfoDepth;
  lfo.connect(lfoGain);
  lfoGain.connect(filterNode.frequency);
  lfo.start();

  filterNode.connect(masterGain);
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function mapCurveToAudio(t) {
  // Map current curve point to frequency modulation
  const p = customExpr || getPreset();
  if (mode !== "parametric" && mode !== "audio") return;

  const xVal = evalExpr(p.x, t);
  const yVal = evalExpr(p.y, t);
  const zVal = evalExpr(p.z, t);
  const wVal = evalExpr(p.w, t);

  // Map x to base frequency offset
  const freqMod = xVal * 100;
  // Map y to filter cutoff
  const filterMod = Math.abs(yVal) * 1000 + 200;
  // Map z to detune
  const detuneMod = zVal * 50;
  // Map w to volume envelope
  const volMod = (wVal + 1) / 2;

  return { freqMod, filterMod, detuneMod, volMod };
}

function startAudio() {
  if (audioPlaying) return;
  initAudio();
  if (audioCtx.state === "suspended") audioCtx.resume();

  // Create oscillators
  oscillators = oscConfigs.map((cfg, i) => {
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = cfg.wave;
    osc.frequency.value = cfg.freq;
    osc.detune.value = cfg.detune;
    oscGain.gain.value = cfg.gain * audioParams.masterVol;
    osc.connect(oscGain);
    oscGain.connect(filterNode);
    osc.start();
    return { osc, gain: oscGain, cfg };
  });

  audioPlaying = true;
  startAudioViz();
}

function stopAudio() {
  oscillators.forEach(o => { try { o.osc.stop(); } catch {} });
  oscillators = [];
  audioPlaying = false;
}

function toggleAudio() {
  if (audioPlaying) stopAudio(); else startAudio();
}

function updateAudioParams() {
  if (!audioCtx) return;
  masterGain.gain.setTargetAtTime(audioParams.masterVol, audioCtx.currentTime, 0.05);
  filterNode.type = audioParams.filterType;
  filterNode.frequency.setTargetAtTime(audioParams.filterFreq, audioCtx.currentTime, 0.05);
  filterNode.Q.setTargetAtTime(audioParams.filterQ, audioCtx.currentTime, 0.05);
  if (lfo) lfo.frequency.setTargetAtTime(audioParams.lfoRate, audioCtx.currentTime, 0.05);

  oscillators.forEach((o, i) => {
    if (oscConfigs[i]) {
      o.osc.type = oscConfigs[i].wave;
      o.osc.frequency.setTargetAtTime(oscConfigs[i].freq, audioCtx.currentTime, 0.05);
      o.osc.detune.setTargetAtTime(oscConfigs[i].detune, audioCtx.currentTime, 0.05);
      o.gain.gain.setTargetAtTime(oscConfigs[i].gain * audioParams.masterVol, audioCtx.currentTime, 0.05);
    }
  });
}

// Map curve animation to audio modulation
function modulateAudioFromCurve() {
  if (!audioPlaying || !oscillators.length) return;
  const t = (animPhase / 360) * Math.PI * 2;
  const mod = mapCurveToAudio(t);
  if (!mod) return;

  oscillators.forEach((o, i) => {
    const baseFreq = oscConfigs[i].freq;
    o.osc.frequency.setTargetAtTime(baseFreq + mod.freqMod * (i * 0.3 + 0.5), audioCtx.currentTime, 0.02);
    o.osc.detune.setTargetAtTime(oscConfigs[i].detune + mod.detuneMod, audioCtx.currentTime, 0.02);
    o.gain.gain.setTargetAtTime(oscConfigs[i].gain * audioParams.masterVol * (0.5 + mod.volMod * 0.5), audioCtx.currentTime, 0.02);
  });
  filterNode.frequency.setTargetAtTime(Math.min(mod.filterMod + audioParams.filterFreq, 15000), audioCtx.currentTime, 0.02);
}

function getAudioState() {
  return {
    params: { ...audioParams },
    oscillators: oscConfigs.map(c => ({ ...c })),
    playing: audioPlaying
  };
}

// ── Audio visualizer ──
let vizAnimId = null;
function startAudioViz() {
  const vizCanvas = document.getElementById("audioViz");
  const vCtx = vizCanvas.getContext("2d");

  function drawViz() {
    if (!audioPlaying || !analyser) { vizAnimId = null; return; }
    const dpr = devicePixelRatio || 1;
    const rect = vizCanvas.getBoundingClientRect();
    vizCanvas.width = rect.width * dpr; vizCanvas.height = rect.height * dpr;
    vCtx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    const bufLen = analyser.frequencyBinCount;
    const data = new Uint8Array(bufLen);
    analyser.getByteFrequencyData(data);

    vCtx.clearRect(0, 0, W, H);
    const barW = W / bufLen * 2.5;
    for (let i = 0; i < bufLen; i++) {
      const barH = (data[i] / 255) * H;
      const hue = (i / bufLen) * 300 + animPhase;
      vCtx.fillStyle = hslFn(hue, 70, 50);
      vCtx.globalAlpha = 0.6;
      vCtx.fillRect(i * barW, H - barH, barW - 1, barH);
    }
    vCtx.globalAlpha = 1;
    vizAnimId = requestAnimationFrame(drawViz);
  }
  if (!vizAnimId) vizAnimId = requestAnimationFrame(drawViz);
}

  for(let ti=0;ti<terms.length;ti++){const tm=terms[ti];ctx.beginPath();ctx.lineWidth=.8;ctx.globalAlpha=.2;ctx.strokeStyle=hslFn((ti/terms.length)*300+animPhase,70,55);for(let i=0;i<=N;i++){const t=(i/N)*Math.PI*2,v=tm.a*Math.cos(tm.n*t)+tm.b*Math.sin(tm.n*t),sx=pad+plotW*(i/N),sy=pad+plotH*(1-(v-minY)/vR);i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy)}ctx.stroke()}
  ctx.lineWidth=lineWidth;ctx.globalAlpha=1;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];ctx.beginPath();ctx.moveTo(pad+plotW*((i-1)/N),pad+plotH*(1-(a.val-minY)/vR));ctx.lineTo(pad+plotW*(i/N),pad+plotH*(1-(b.val-minY)/vR));ctx.strokeStyle=hslFn(((b.val-minY)/vR)*300+animPhase,85,58);ctx.stroke()}ctx.globalAlpha=1;
}

function randomize(){
  const fns=["sin","cos"],rn=()=>(Math.random()*6+1|0),rc=()=>(Math.random()*1.5+.1).toFixed(2),rf=()=>`${rc()}*Math.${fns[Math.random()*2|0]}(${rn()}*t)`;
  const x=rf(),y=rf(),z=`${(Math.random()*.6+.1).toFixed(2)}*Math.${fns[Math.random()*2|0]}(${rn()}*t)`,w=`${(Math.random()*.5+.1).toFixed(2)}*Math.${fns[Math.random()*2|0]}(${rn()}*t)`;
  const ar=(e)=>{let mn=Infinity,mx=-Infinity;for(let i=0;i<=500;i++){const t=(i/500)*Math.PI*2,v=evalExpr(e,t);if(v<mn)mn=v;if(v>mx)mx=v}return[mn-.1,mx+.1]};
  customExpr={x,y,z,w,xL:x.replace(/Math\./g,""),yL:y.replace(/Math\./g,""),zL:z.replace(/Math\./g,""),wL:w.replace(/Math\./g,""),xR:ar(x),yR:ar(y),zR:ar(z),wR:ar(w),name:"Random"};
  updateUI();toast("Random curve!");
}

    keys.forEach((k,i)=>{html+=`<div class="fld"><div class="fld-l"><span class="dot" style="background:${colors[i]}"></span>${labels[i]}</div><input class="finp" id="edit_${k}" value="${vals[i]}" onchange="applyEdits()"></div>`});
    html+=`</div>`;

    html+=`<div class="sec"><div class="sec-t">DISPLAY</div>
      <div class="srow"><span class="slbl">Line width</span><input type="range" min="0.5" max="5" step="0.1" value="${lineWidth}" oninput="lineWidth=+this.value;draw()"><span class="sval">${lineWidth.toFixed(1)}</span></div>
      <div class="srow"><span class="slbl">Resolution</span><input type="range" min="500" max="5000" step="100" value="${steps}" oninput="steps=+this.value;draw()"><span class="sval">${steps}</span></div>
      <div class="srow"><span class="slbl">Speed</span><input type="range" min="0.1" max="5" step="0.1" value="${speed}" oninput="speed=+this.value;updateUI()"><span class="sval">${speed.toFixed(1)}</span></div>
      <div class="srow"><span class="slbl">Zoom</span><input type="range" min="0.3" max="5" step="0.1" value="${zoom}" oninput="zoom=+this.value;draw()"><span class="sval">${zoom.toFixed(1)}</span></div>
    </div>`;

    html+=`<div class="sec"><div class="sec-t">ACTIONS</div><div class="brow">
      <button class="bsm" onclick="resetView()">↺ RESET</button>
      <button class="bsm" onclick="randomize()">🎲 RANDOM</button>
      <button class="bsm" onclick="addCurrentFav()">☆ SAVE</button>
      ${walletConnected?'<button class="bsm beats-btn" onclick="mintComposition()">⛓ MINT</button>':''}
    </div></div>`;

    body.innerHTML=html;
  }

  // ── FAVOURITES ──
  else if(openPanelId==="favourites"){
    title.textContent="☆ FAVOURITES";
    if(favourites.length===0){body.innerHTML=`<div style="text-align:center;padding:40px 16px;color:var(--txM);font-size:10px;line-height:1.8">No favourites yet.<br>Right-click or click ☆ to add.</div>`}
    else{body.innerHTML=`<div class="sec"><div class="sec-t">SAVED CURVES</div><div class="preset-list">${favourites.map((f,i)=>`<div class="preset-item" onclick="loadFav(${i})"><span>${f.mode==='fourier'?'∿':f.mode==='audio'?'♫':'▣'} ${f.name}</span><button class="fav-btn is-fav" onclick="event.stopPropagation();removeFav(${i})">★</button></div>`).join("")}</div></div><div class="sec"><button class="bsm danger" onclick="favourites=[];saveFavs();renderPanel();toast('Cleared')">CLEAR ALL</button></div>`}
  }

  // ── PRESETS ──
  else if(openPanelId==="presets"){
    title.textContent="☰ PRESETS";
    body.innerHTML=`<div class="sec"><div class="sec-t">${mode.toUpperCase()} PRESETS</div><div class="preset-list">${getPresets().map((p,i)=>{const iF=favourites.some(f=>f.name===p.name&&f.mode===mode);return`<div class="preset-item ${i===presetIdx&&!customExpr?'current':''}" onclick="presetIdx=${i};customExpr=null;updateUI();renderPanel()"><span>${p.name}</span><button class="fav-btn ${iF?'is-fav':''}" onclick="event.stopPropagation();toggleFavPreset(${i})">${iF?'★':'☆'}</button></div>`}).join("")}</div></div>`;
  }
}

function toggleFavPreset(idx){const p=getPresets()[idx];const fi=favourites.findIndex(f=>f.name===p.name&&f.mode===mode);if(fi>=0){favourites.splice(fi,1);toast("Removed")}else{favourites.push({name:p.name,mode,presetIdx:idx,isCustom:false});toast("★ Favourited")}saveFavs();renderPanel()}

function applyEdits(){
  const wrap=(s)=>s.replace(/sin/g,"Math.sin").replace(/cos/g,"Math.cos").replace(/tan/g,"Math.tan").replace(/abs/g,"Math.abs").replace(/sqrt/g,"Math.sqrt").replace(/PI/g,"Math.PI");
  const ar=(e)=>{let mn=Infinity,mx=-Infinity;for(let i=0;i<=500;i++){const t=(i/500)*Math.PI*2,v=evalExpr(e,t);if(v<mn)mn=v;if(v>mx)mx=v}return[mn-.1,mx+.1]};
  const x=wrap(document.getElementById("edit_x").value),y=wrap(document.getElementById("edit_y").value),z=wrap(document.getElementById("edit_z").value),w=wrap(document.getElementById("edit_w").value);
  customExpr={x,y,z,w,xL:document.getElementById("edit_x").value,yL:document.getElementById("edit_y").value,zL:document.getElementById("edit_z").value,wL:document.getElementById("edit_w").value,xR:ar(x),yR:ar(y),zR:ar(z),wR:ar(w),name:"Custom"};
  updateUI();toast("Updated");
}

function exportPNG(){const l=document.createElement("a");l.download="ndao-beats-curve.png";l.href=canvas.toDataURL("image/png");l.click();toast("PNG downloaded")}

// ── Mouse / Touch / Keyboard ──
canvas.addEventListener("mousedown",e=>{if(e.button===2)return;dragging=true;lastMouse={x:e.clientX,y:e.clientY};canvas.classList.add("grabbing")});
addEventListener("mousemove",e=>{if(!dragging)return;rotation.y+=(e.clientX-lastMouse.x)*.005;rotation.x+=(e.clientY-lastMouse.y)*.005;lastMouse={x:e.clientX,y:e.clientY};if(!playing)draw()});
addEventListener("mouseup",()=>{dragging=false;canvas.classList.remove("grabbing")});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.3,Math.min(5,zoom-e.deltaY*.001));if(!playing)draw();document.getElementById("speedBg").textContent=`SPEED:${speed.toFixed(1)}x · ZOOM:${zoom.toFixed(1)}x`},{passive:false});
canvas.addEventListener("touchstart",e=>{if(e.touches.length===1){dragging=true;lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY}}},{passive:true});
canvas.addEventListener("touchmove",e=>{if(!dragging||e.touches.length!==1)return;rotation.y+=(e.touches[0].clientX-lastMouse.x)*.005;rotation.x+=(e.touches[0].clientY-lastMouse.y)*.005;lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};if(!playing)draw()},{passive:true});
canvas.addEventListener("touchend",()=>{dragging=false});

canvas.addEventListener("contextmenu",e=>{e.preventDefault();const m=document.getElementById("ctxMenu");m.innerHTML=`<button class="ctx-item" onclick="togglePanel('editor');hideCtx()">✎ Edit equations</button><button class="ctx-item" onclick="togglePanel('presets');hideCtx()">☰ Presets</button><button class="ctx-item" onclick="togglePanel('audio');hideCtx()">♫ Audio synth</button><button class="ctx-item" onclick="randomize();hideCtx()">🎲 Random</button><div class="ctx-sep"></div><button class="ctx-item" onclick="addCurrentFav();hideCtx()">☆ Favourite</button><button class="ctx-item" onclick="exportPNG();hideCtx()">📤 Export PNG</button>${walletConnected?'<button class="ctx-item" onclick="mintComposition();hideCtx()">⛓ Mint (1 BEATS)</button>':''}<div class="ctx-sep"></div><button class="ctx-item" onclick="resetView();hideCtx()">↺ Reset</button>`;m.style.left=Math.min(e.clientX,innerWidth-200)+"px";m.style.top=Math.min(e.clientY,innerHeight-300)+"px";m.classList.add("show")});
function hideCtx(){document.getElementById("ctxMenu").classList.remove("show")}
document.addEventListener("click",e=>{if(!e.target.closest(".ctx-menu"))hideCtx()});

addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="ArrowLeft")prevPreset();if(e.key==="ArrowRight")nextPreset();
  if(e.key===" "){e.preventDefault();togglePlay()}
  if(e.key==="e"||e.key==="E")togglePanel("editor");
  if(e.key==="f"||e.key==="F")togglePanel("favourites");
  if(e.key==="p"||e.key==="P")togglePanel("presets");
  if(e.key==="a"||e.key==="A")togglePanel("audio");
  if(e.key==="w"||e.key==="W"){if(walletConnected)togglePanel("chain");else connectWallet()}
  if(e.key==="r"||e.key==="R")randomize();
  if(e.key==="m"||e.key==="M")toggleAudio();
  if(e.key==="Escape"){closePanel();hideCtx()}
  if(e.key==="+"||e.key==="=")speed=Math.min(5,speed+.2);
  if(e.key==="-")speed=Math.max(.1,speed-.2);
  updateUI();
});

addEventListener("resize",()=>draw());

// ── Init ──
updateWalletUI();
updateUI();
startAnim();

// Restore WebAuth session on page load
(async () => {
  // Wait for ProtonWebSDK to be available (up to 8 seconds)
  let waited = 0;
  while (!window.ProtonWebSDK && waited < 8000) {
    await new Promise(r => setTimeout(r, 200));
    waited += 200;
  }
  if (window.ProtonWebSDK) {
    console.log("[XPR] SDK ready, restoring session...");
    await restoreSession();
  } else {
    console.warn("[XPR] SDK not available after timeout");
  }
  // Auto-refresh balance every 30 seconds if connected
  setInterval(async () => {
    if (walletConnected) {
      await fetchBeatsBalance();
      if (openPanelId === "chain") renderPanel();
    }
  }, 30000);
})();
</script>
</body>
</html>
